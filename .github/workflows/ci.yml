
name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/charlesdev96/gitops-demo-api

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

  build-and-update-gitops:
    name: Build image and update GitOps
    runs-on: ubuntu-latest
    needs: test

    # Only publish and update deployments after a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: charlesdev96/platform-argo-cd-assignment
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-config

      - name: Update staging and production image tags
        working-directory: gitops-config
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying image tag: ${IMAGE_TAG}"

          for overlay in staging production; do
            FILE="overlays/${overlay}/kustomization.yaml"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing GitOps file: $FILE"
              exit 1
            fi

            sed -i \
              "s/^    newTag: .*/    newTag: ${IMAGE_TAG}/" \
              "$FILE"

            echo "Updated $FILE"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            overlays/staging/kustomization.yaml \
            overlays/production/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Both GitOps overlays already use this image tag."
            exit 0
          fi

          git commit -m "Update staging and production image to ${IMAGE_TAG}"
          git push origin main
